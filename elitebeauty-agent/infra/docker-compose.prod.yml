services:
  backend:
    image: ${ECR_REGISTRY}/elitebeauty-backend:${IMAGE_TAG:-latest}
    container_name: eb_backend
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env.prod
        required: false
    environment:
      - WA_BRIDGE_URL=http://wa_bridge:3001
    restart: always

  wa_bridge:
    image: ${ECR_REGISTRY}/elitebeauty-wa-bridge:${IMAGE_TAG:-latest}
    container_name: eb_wa_bridge
    ports:
      - "3001:3001"
    env_file:
      - path: ../.env.prod
        required: false
    environment:
      - BACKEND_URL=http://backend:8000
      - WA_SESSION_DIR=/app/session
    volumes:
      - wa_session:/app/session
    restart: always

  frontend:
    image: ${ECR_REGISTRY}/elitebeauty-frontend:${IMAGE_TAG:-latest}
    container_name: eb_frontend
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - backend

volumes:
  wa_session:
