# ─── Elite Beauty Agent — Render Blueprint ────────────────────────────────────
# Tres servicios independientes sin Docker Compose.
# Documentación de despliegue: README_DEPLOY_RENDER.md
#
# ANTES DE HACER PUSH:
#   1. Reemplaza los valores "REEMPLAZAR" en el panel de Render > Environment Variables.
#   2. NO pongas claves reales aquí — usa sync: false para secretos.

services:

  # ── 1. Backend FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: elitebeauty-backend
    runtime: docker
    rootDir: elitebeauty-agent/backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMBEDDINGS_PROVIDER
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Cambia por la URL real una vez creados los servicios
      - key: PUBLIC_BASE_URL
        value: https://elitebeauty-backend.onrender.com
      - key: WA_BRIDGE_URL
        value: https://elitebeauty-wa-bridge.onrender.com
      # Dominio(s) del frontend, separados por coma
      - key: CORS_ORIGINS
        value: https://elitebeauty-frontend.onrender.com
      - key: SECRET_KEY
        sync: false

  # ── 2. Frontend React/Vite ──────────────────────────────────────────────────
  - type: web
    name: elitebeauty-frontend
    runtime: static
    rootDir: elitebeauty-agent/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Variables inyectadas en BUILD TIME por Render (Vite las embebe en el bundle)
      - key: VITE_API_BASE_URL
        value: https://elitebeauty-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://elitebeauty-backend.onrender.com/ws
      - key: VITE_WA_BRIDGE_PUBLIC_URL
        value: https://elitebeauty-wa-bridge.onrender.com

  # ── 3. WA Bridge Node.js / whatsapp-web.js ─────────────────────────────────
  - type: web
    name: elitebeauty-wa-bridge
    runtime: docker
    rootDir: elitebeauty-agent/backend/wa_bridge
    plan: starter
    healthCheckPath: /status
    disk:
      name: wa-session
      mountPath: /app/session
      sizeGB: 1
    envVars:
      - key: BACKEND_URL
        value: https://elitebeauty-backend.onrender.com
      - key: WA_SESSION_DIR
        value: /app/session
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
